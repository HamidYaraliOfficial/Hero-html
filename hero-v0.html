<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۵۰ هیرو سکشن سه بعدی برنامه نویسی</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html { scroll-behavior: smooth; }
  
  body {
    background: #050510;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow-x: hidden;
    color: #fff;
  }

  /* نوار پیشرفت اسکرول */
  .progress-bar {
    position: fixed;
    top: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #00ffff, #ff00ff, #00ff41, #f7df1e);
    z-index: 9999;
    width: 0%;
    box-shadow: 0 0 20px rgba(0,255,255,0.8);
    transition: width 0.1s ease;
  }

  /* شمارنده هیرو */
  .hero-counter {
    position: fixed;
    bottom: 30px;
    left: 30px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    padding: 12px 24px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 9998;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #00ffff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .hero-counter span { color: #fff; font-weight: bold; }

  /* ============ ساختار هیرو سکشن ============ */
  .hero {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    perspective: 2000px;
    transform-style: preserve-3d;
    padding: 60px;
  }

  .hero-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    max-width: 1400px;
    width: 100%;
    align-items: center;
    transform-style: preserve-3d;
    position: relative;
    z-index: 10;
  }

  .hero-content.reverse {
    direction: ltr;
  }
  .hero-content.reverse > * {
    direction: rtl;
  }

  .hero-text {
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  .hero-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 25px;
    backdrop-filter: blur(10px);
    text-transform: uppercase;
  }

  .hero-title {
    font-size: clamp(38px, 5vw, 72px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 25px;
    letter-spacing: -1px;
  }

  .hero-desc {
    font-size: 17px;
    line-height: 1.9;
    opacity: 0.85;
    margin-bottom: 35px;
    max-width: 550px;
  }

  .hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00ffff, #00bfff);
    color: #000;
    box-shadow: 0 10px 40px rgba(0,255,255,0.4);
  }

  .btn-primary:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 20px 50px rgba(0,255,255,0.6);
  }

  .btn-outline {
    background: transparent;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.8);
    transform: translateY(-4px);
  }

  /* ============ تصویر سه بعدی ============ */
  .hero-image-wrap {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 450px;
  }

  .hero-image {
    width: 100%;
    max-width: 520px;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
    position: relative;
    z-index: 2;
  }

  /* کارت شناور روی تصویر */
  .float-card {
    position: absolute;
    background: rgba(20,20,40,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 14px 20px;
    border-radius: 16px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    z-index: 5;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    animation: floatCard 4s ease-in-out infinite;
  }

  .float-card-1 { top: 20px; right: -20px; animation-delay: 0s; }
  .float-card-2 { bottom: 40px; left: -30px; animation-delay: 1.5s; }
  .float-card-3 { top: 50%; right: -40px; animation-delay: 0.8s; }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0) translateZ(40px); }
    50% { transform: translateY(-15px) translateZ(60px); }
  }

  /* گوی‌های نورانی پس‌زمینه */
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 1;
    pointer-events: none;
  }

// ============ ذرات شناور برای هر هیرو ============
document.querySelectorAll('.hero').forEach(hero => {
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const size = 1 + Math.random() * 4;

    particle.style.height = size + 'px';

    particle.style.bottom = '-10px';
    particle.style.animationDuration = (6 + Math.random() * 10) + 's';

    hero.appendChild(particle);
  }
});

// ============ نوار پیشرفت اسکرول ============
const progressBar = document.getElementById('progressBar');
const currentHeroSpan = document.getElementById('currentHero');

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / docHeight) * 100;
  progressBar.style.width = progress + '%';
  
  // شمارنده هیرو
  const heroIndex = Math.min(50, Math.floor(scrollTop / window.innerHeight) + 1);
  currentHeroSpan.textContent = heroIndex;
});

// ============ افکت پارالاکس و سه بعدی ============
const heroSections = document.querySelectorAll('.hero');

function handleParallax() {
  const scrollY = window.scrollY;
  const windowHeight = window.innerHeight;
  
  heroSections.forEach((hero, index) => {
    const rect = hero.getBoundingClientRect();
    const heroCenter = rect.top + rect.height / 2;
    const distanceFromCenter = heroCenter - windowHeight / 2;
    const progress = distanceFromCenter / windowHeight;
    
    // چرخش و جابجایی محتوا
    const textEl = hero.querySelector('.hero-text');
    const imageEl = hero.querySelector('.hero-image-wrap');
    
    if (textEl) {
      const rotY = progress * 15;
      const transZ = -Math.abs(progress) * 100;
      textEl.style.transform = `perspective(1500px) rotateY(${rotY}deg) translateZ(${transZ}px)`;
    }
    
    if (imageEl) {
      const rotY = -progress * 15;
      const transZ = -Math.abs(progress) * 150;
      imageEl.style.transform = `perspective(1500px) rotateY(${rotY}deg) translateZ(${transZ}px)`;
    }
    
    // اوپاسیتی
    const opacity = Math.max(0, 1 - Math.abs(progress) * 0.9);
    hero.querySelector('.hero-content').style.opacity = opacity;
  });
}

// ============ ردیابی ماوس برای افکت سه بعدی ============
heroSections.forEach(hero => {
  hero.addEventListener('mousemove', (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    
    const img = hero.querySelector('.hero-image');
    if (img) {
      img.style.transform = `rotateY(${x * 20}deg) rotateX(${-y * 20}deg) scale(1.02)`;
    }
  });
  
  hero.addEventListener('mouseleave', () => {
    const img = hero.querySelector('.hero-image');
    if (img) {
      img.style.transform = 'rotateY(0) rotateX(0) scale(1)';
    }
  });
});

// ============ اجرا با requestAnimationFrame ============
let ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      handleParallax();
      ticking = false;
    });
    ticking = true;
  }
});

window.addEventListener('load', handleParallax);

// ============ انیمیشن ورودی برای هر هیرو ============
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      entry.target.style.transform = 'translateY(0)';
    }
  });
}, { threshold: 0.1 });

heroSections.forEach(hero => {
  observer.observe(hero);
});

console.log('🚀 ۵۰ هیرو سکشن سه بعدی با موفقیت بارگذاری شد!');
