<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER | ۱۰۰ هیرو تجربی سه بعدی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Bebas+Neue&family=Cormorant+Garamond:wght@300;400;700;900&family=Major+Mono+Display&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ==================================================
   AETHER FRAMEWORK — Brand New System
================================================== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --ink: #0a0a0f;
  --paper: #f4f1ea;
  --chrome: #c9c9d4;
  --accent-a: #ff3366;
  --accent-b: #00d9ff;
  --accent-c: #ffe14d;
  --accent-d: #7c5cff;
  --accent-e: #00ff88;
  --muted: #6b6b7a;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  background: var(--ink);
  color: var(--paper);
  font-family: 'Syne', sans-serif;
  overflow-x: hidden;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  cursor: none;
}

/* ==================================================
   CUSTOM CURSOR
================================================== */
.cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: var(--accent-a);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999999;
  transition: transform 0.1s ease;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed;
  width: 40px;
  height: 40px;
  border: 1.5px solid var(--paper);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999998;
  transition: transform 0.35s cubic-bezier(0.19, 1, 0.22, 1),
              width 0.3s ease, height 0.3s ease,
              background 0.3s ease, border 0.3s ease;
}
.cursor-ring.hover {
  width: 80px;
  height: 80px;
  background: rgba(255, 51, 102, 0.15);
  border-color: var(--accent-a);
}

/* ==================================================
   SCROLLBAR
================================================== */
::-webkit-scrollbar { width: 0; }

/* ==================================================
   NOISE OVERLAY
================================================== */
.noise {
  position: fixed;
  inset: 0;
  z-index: 9990;
  pointer-events: none;
  opacity: 0.05;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ==================================================
   INTRO SPLASH
================================================== */
.splash {
  position: fixed;
  inset: 0;
  background: var(--ink);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1s ease 0.3s, visibility 1s ease 0.3s;
}
.splash.gone {
  opacity: 0;
  visibility: hidden;
}
.splash-inner {
  position: relative;
  text-align: center;
}
.splash-letters {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 40px;
}
.splash-letter {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(60px, 12vw, 160px);
  line-height: 1;
  color: var(--paper);
  transform: translateY(120%);
  opacity: 0;
  animation: letterRise 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}
.splash-letter:nth-child(1) { animation-delay: 0.1s; color: var(--accent-a); }
.splash-letter:nth-child(2) { animation-delay: 0.2s; color: var(--accent-b); }
.splash-letter:nth-child(3) { animation-delay: 0.3s; color: var(--accent-c); }
.splash-letter:nth-child(4) { animation-delay: 0.4s; color: var(--accent-d); }
.splash-letter:nth-child(5) { animation-delay: 0.5s; color: var(--accent-e); }
.splash-letter:nth-child(6) { animation-delay: 0.6s; color: var(--paper); }

@keyframes letterRise {
  to { transform: translateY(0); opacity: 1; }
}

.splash-sub {
  font-family: 'Major Mono Display', monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 8px;
  opacity: 0;
  animation: fadeIn 1s ease 1s forwards;
}
.splash-progress {
  margin-top: 50px;
  width: 300px;
  height: 1px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.splash-progress::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--paper);
  transform: translateX(-100%);
  animation: progressSlide 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards 0.5s;
}
@keyframes progressSlide {
  to { transform: translateX(0); }
}
@keyframes fadeIn {
  to { opacity: 1; }
}

/* ==================================================
   TOP MARQUEE
================================================== */
.top-marquee {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 34px;
  background: var(--paper);
  color: var(--ink);
  z-index: 9995;
  overflow: hidden;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--ink);
}
.top-marquee-inner {
  display: flex;
  gap: 40px;
  animation: marqueeLeft 40s linear infinite;
  white-space: nowrap;
  padding-left: 40px;
}
.top-marquee-item {
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.top-marquee-item::before {
  content: '✱';
  font-size: 14px;
}
@keyframes marqueeLeft {
  to { transform: translateX(-50%); }
}

/* ==================================================
   CORNER NAVIGATION
================================================== */
.corner-nav {
  position: fixed;
  top: 50px;
  right: 30px;
  z-index: 9994;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.corner-nav-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  letter-spacing: 2px;
  color: var(--paper);
  line-height: 0.9;
  margin-bottom: 6px;
}
.corner-nav-brand span {
  color: var(--accent-a);
}
.corner-nav-links {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-end;
}
.corner-nav-link {
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  color: var(--muted);
  text-decoration: none;
  letter-spacing: 2px;
  transition: color 0.3s ease;
  position: relative;
  padding-right: 18px;
}
.corner-nav-link::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  width: 10px;
  height: 1px;
  background: currentColor;
  transform: translateY(-50%);
  transition: width 0.3s ease;
}
.corner-nav-link:hover {
  color: var(--accent-a);
}
.corner-nav-link:hover::after {
  width: 20px;
}

/* ==================================================
   SIDE COUNTER
================================================== */
.side-counter {
  position: fixed;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 9994;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.side-counter-label {
  font-family: 'Major Mono Display', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 4px;
  writing-mode: vertical-rl;
  text-transform: uppercase;
}
.side-counter-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  color: var(--paper);
  line-height: 1;
}
.side-counter-total {
  font-family: 'Major Mono Display', monospace;
  font-size: 11px;
  color: var(--muted);
}

/* ==================================================
   PROGRESS VERTICAL
================================================== */
.progress-v {
  position: fixed;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 60vh;
  background: rgba(255,255,255,0.06);
  z-index: 9993;
  border-radius: 2px;
  overflow: hidden;
}
.progress-v-fill {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 0%;
  background: var(--accent-a);
  transition: height 0.15s linear;
}

/* ==================================================
   HERO BASE — COMPLETELY NEW STRUCTURE
================================================== */
.hero {
  min-height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 100px;
  perspective: 2000px;
}

.hero-canvas {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* Aesthetic grid */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 0;
  pointer-events: none;
}

/* Corner crosses */
.hero-cross {
  position: absolute;
  width: 20px;
  height: 20px;
  z-index: 2;
  opacity: 0.3;
}
.hero-cross::before,
.hero-cross::after {
  content: '';
  position: absolute;
  background: var(--paper);
}
.hero-cross::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: 1px;
  transform: translateY(-50%);
}
.hero-cross::after {
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  transform: translateX(-50%);
}
.hero-cross.tl { top: 60px; left: 40px; }
.hero-cross.tr { top: 60px; right: 40px; }
.hero-cross.bl { bottom: 40px; left: 40px; }
.hero-cross.br { bottom: 40px; right: 40px; }

/* ==================================================
   HERO CONTENT — NEW LAYOUT
================================================== */
.hero-content {
  position: relative;
  z-index: 5;
  max-width: 1500px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}

/* NUMBER MARKER (giant) */
.hero-number {
  position: absolute;
  top: -80px;
  right: -20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(180px, 22vw, 380px);
  line-height: 0.8;
  color: var(--paper);
  opacity: 0.04;
  z-index: -1;
  pointer-events: none;
  letter-spacing: -8px;
}
.hero.reverse .hero-number {
  right: auto;
  left: -20px;
}

/* LEFT PANEL */
.hero-panel {
  display: flex;
  flex-direction: column;
  gap: 30px;
  position: relative;
}

.hero-tag-row {
  display: flex;
  align-items: center;
  gap: 15px;
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
}
.hero-tag-row .line {
  flex: 1;
  height: 1px;
  background: currentColor;
  opacity: 0.3;
}
.hero-tag-row .tag-index {
  color: var(--accent-a);
  font-weight: 700;
}

.hero-title-v2 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(44px, 6vw, 92px);
  line-height: 0.95;
  letter-spacing: -3px;
  margin-bottom: 0;
  position: relative;
}
.hero-title-v2 .word {
  display: inline-block;
  overflow: hidden;
  vertical-align: top;
}
.hero-title-v2 .word-inner {
  display: inline-block;
  transform: translateY(110%);
  transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
}
.hero.animated .hero-title-v2 .word-inner {
  transform: translateY(0);
}
.hero-title-v2 .word:nth-child(1) .word-inner { transition-delay: 0.1s; }
.hero-title-v2 .word:nth-child(2) .word-inner { transition-delay: 0.2s; }
.hero-title-v2 .word:nth-child(3) .word-inner { transition-delay: 0.3s; }

.hero-desc-v2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  line-height: 1.6;
  color: var(--chrome);
  opacity: 0.8;
  max-width: 520px;
  font-weight: 300;
  font-style: italic;
}

.hero-meta-row {
  display: flex;
  gap: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.hero-meta-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-meta-label {
  font-family: 'Major Mono Display', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
.hero-meta-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  color: var(--paper);
  letter-spacing: 1px;
}

.hero-actions {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-top: 10px;
}

/* BUTTON — New style */
.btn-aether {
  position: relative;
  padding: 18px 36px;
  background: transparent;
  color: var(--paper);
  border: none;
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  cursor: none;
  overflow: hidden;
  border-radius: 0;
  transition: color 0.4s ease;
}
.btn-aether::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--paper);
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
  z-index: -1;
}
.btn-aether:hover {
  color: var(--ink);
}
.btn-aether:hover::before {
  transform: translateY(0);
}
.btn-aether {
  border: 1px solid var(--paper);
  z-index: 1;
}
.btn-aether .arrow {
  transition: transform 0.4s ease;
}
.btn-aether:hover .arrow {
  transform: translateX(-6px);
}

/* Text link */
.btn-text {
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-decoration: none;
  padding: 8px 0;
  position: relative;
  transition: color 0.3s ease;
  cursor: none;
}
.btn-text::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 0;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform-origin: right;
  transform: scaleX(0);
  transition: transform 0.4s ease;
}
.btn-text:hover {
  color: var(--paper);
}
.btn-text:hover::after {
  transform: scaleX(1);
}

/* RIGHT PANEL — MEDIA */
.hero-visual {
  position: relative;
  aspect-ratio: 4 / 5;
  max-height: 640px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-frame {
  position: absolute;
  inset: 0;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,0.5);
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
}
.hero-frame img,
.hero-frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  position: absolute;
  inset: 0;
}
.hero-frame video {
  opacity: 0;
  transition: opacity 0.5s ease;
}
.hero-frame:hover video {
  opacity: 1;
}
.hero-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6));
  pointer-events: none;
}

/* Rotated decorative text on frame */
.hero-frame-deco {
  position: absolute;
  left: -40px;
  top: 50%;
  transform: rotate(-90deg) translateX(50%);
  transform-origin: left top;
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  white-space: nowrap;
}
.hero-frame-deco::before {
  content: '●';
  color: var(--accent-a);
  margin-left: 8px;
}

/* Corner brackets on frame */
.bracket {
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2px solid var(--paper);
  z-index: 3;
  transition: all 0.4s ease;
}
.bracket.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.bracket.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.bracket.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.bracket.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.hero-frame:hover .bracket {
  width: 40px;
  height: 40px;
  border-color: var(--accent-a);
}

/* Floating info cards — NEW design */
.info-card {
  position: absolute;
  background: var(--paper);
  color: var(--ink);
  padding: 14px 18px;
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  z-index: 10;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  border-radius: 2px;
  min-width: 140px;
}
.info-card-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0;
  color: var(--accent-a);
  margin-bottom: 4px;
}
.info-card-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.info-card.c1 {
  top: 30px;
  left: -60px;
  transform: rotate(-4deg);
  animation: floatA 6s ease-in-out infinite;
}
.info-card.c2 {
  bottom: 80px;
  right: -50px;
  transform: rotate(3deg);
  background: var(--accent-c);
  animation: floatB 5s ease-in-out infinite;
}
.info-card.c3 {
  bottom: 20px;
  left: -30px;
  transform: rotate(-2deg);
  background: var(--accent-b);
  animation: floatA 7s ease-in-out infinite reverse;
}
@keyframes floatA {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-14px) rotate(-4deg); }
}
@keyframes floatB {
  0%, 100% { transform: translateY(0) rotate(3deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}

/* ==================================================
   BOTTOM TICKER PER HERO
================================================== */
.hero-ticker {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 14px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(20px);
  z-index: 6;
  overflow: hidden;
}
.hero-ticker-inner {
  display: flex;
  gap: 40px;
  white-space: nowrap;
  animation: marqueeLeft 25s linear infinite;
}
.hero-ticker-item {
  font-family: 'Major Mono Display', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  display: flex;
  gap: 12px;
  align-items: center;
}
.hero-ticker-item::before {
  content: '◦';
  color: var(--accent-a);
  font-size: 12px;
}

/* ==================================================
   LEFT VERTICAL META (per hero)
================================================== */
.hero-vertical-meta {
  position: absolute;
  left: 40px;
  bottom: 80px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  font-family: 'Major Mono Display', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  z-index: 5;
}
.hero-vertical-meta .vm-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-vertical-meta .vm-item::before {
  content: '';
  width: 20px;
  height: 1px;
  background: currentColor;
}

/* ==================================================
   THEME VARIATIONS — BRAND NEW PALETTES
================================================== */

/* A: BONE / PAPER / INK */
.t-a { background: #0a0a0f; }
.t-a .hero-number { color: #ff3366; }
.t-a .hero-title-v2 { color: #f4f1ea; }
.t-a .hero-title-v2 .word:nth-child(1) .word-inner { color: #ff3366; }
.t-a .info-card-title { color: #ff3366; }

/* B: DEEP OCEAN */
.t-b { background: #041d2b; }
.t-b .hero-number { color: #00d9ff; }
.t-b .hero-title-v2 { color: #f4f1ea; }
.t-b .hero-title-v2 .word:nth-child(2) .word-inner { color: #00d9ff; }

/* C: TERRACOTTA */
.t-c { background: #2a0f0a; }
.t-c .hero-number { color: #ff6b35; }
.t-c .hero-title-v2 { color: #f4e8d8; }
.t-c .hero-title-v2 .word:nth-child(1) .word-inner { color: #ff6b35; }

/* D: FOREST */
.t-d { background: #0a1a0f; }
.t-d .hero-number { color: #00ff88; }
.t-d .hero-title-v2 { color: #e8f4ea; }
.t-d .hero-title-v2 .word:nth-child(2) .word-inner { color: #00ff88; }

/* E: ROYAL */
.t-e { background: #10052a; }
.t-e .hero-number { color: #7c5cff; }
.t-e .hero-title-v2 { color: #ece4ff; }
.t-e .hero-title-v2 .word:nth-child(1) .word-inner { color: #7c5cff; }

/* F: SAND */

    <section class="hero ${d.theme} ${reverseClass}" id="h${d.id}" data-hero="${d.id}">

      <div class="hero-cross tl"></div>
      <div class="hero-cross tr"></div>
      <div class="hero-cross bl"></div>
      <div class="hero-cross br"></div>
      <div class="hero-number">${String(d.id).padStart(3, '0')}</div>

      <div class="hero-content">
        ${reverse ? mediaBlock + textBlock : textBlock + mediaBlock}
      </div>

      <div class="hero-vertical-meta">
        <div class="vm-item">CHAPTER ${String(d.id).padStart(3, '0')}</div>
        <div class="vm-item">AETHER VOL. III</div>
      </div>

      <div class="hero-ticker">
        <div class="hero-ticker-inner">
          <span class="hero-ticker-item">${d.tick}</span>
          <span class="hero-ticker-item">${d.badge}</span>
          <span class="hero-ticker-item">AETHER FRAMEWORK</span>
          <span class="hero-ticker-item">${d.tick}</span>
          <span class="hero-ticker-item">${d.badge}</span>
          <span class="hero-ticker-item">AETHER FRAMEWORK</span>
        </div>
      </div>
    </section>
  `;

  container.insertAdjacentHTML('beforeend', html);
});

/* ==================================================
   THREE.JS PARTICLES
================================================== */
document.querySelectorAll('.hero-canvas').forEach((canvas, idx) => {
  const hero = canvas.closest('.hero');
  const rect = hero.getBoundingClientRect();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, rect.width / rect.height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  const count = 70;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 24;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 24;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 12;
    velocities.push({
      x: (Math.random() - 0.5) * 0.008,
      y: (Math.random() - 0.5) * 0.008,
      z: (Math.random() - 0.5) * 0.008
    });
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const palettes = [0xff3366, 0x00d9ff, 0xffe14d, 0x7c5cff, 0x00ff88, 0xff6b35, 0x4dffc3, 0xb84dff];
  const color = palettes[idx % palettes.length];

  const mat = new THREE.PointsMaterial({
    color,
    size: 0.05,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Torus knot outline
  const knotGeo = new THREE.TorusKnotGeometry(1.4, 0.4, 100, 16);
  const knotMat = new THREE.MeshBasicMaterial({
    color,
    wireframe: true,
    transparent: true,
    opacity: 0.06
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  scene.add(knot);

  // Thin rings
  const ring1 = new THREE.Mesh(
    new THREE.TorusGeometry(2.6, 0.012, 8, 80),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.2 })
  );
  scene.add(ring1);
  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(3.4, 0.008, 8, 80),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1 })
  );
  scene.add(ring2);

  let mx = 0, my = 0;
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    my = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });

  let visible = false;
  new IntersectionObserver((entries) => {
    visible = entries[0].isIntersecting;
  }, { threshold: 0.05 }).observe(hero);

  function animate() {
    requestAnimationFrame(animate);
    if (!visible) return;

    knot.rotation.x += 0.002;
    knot.rotation.y += 0.003;
    ring1.rotation.z += 0.001;
    ring2.rotation.x += 0.0008;

    const pos = geo.attributes.position.array;
    for (let i = 0; i < count; i++) {
      pos[i * 3] += velocities[i].x;
      pos[i * 3 + 1] += velocities[i].y;
      pos[i * 3 + 2] += velocities[i].z;
      if (Math.abs(pos[i * 3]) > 12) velocities[i].x *= -1;
      if (Math.abs(pos[i * 3 + 1]) > 12) velocities[i].y *= -1;
      if (Math.abs(pos[i * 3 + 2]) > 6) velocities[i].z *= -1;
    }
    geo.attributes.position.needsUpdate = true;

    camera.position.x += (mx * 1.2 - camera.position.x) * 0.04;
    camera.position.y += (-my * 1.2 - camera.position.y) * 0.04;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const r = hero.getBoundingClientRect();
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    renderer.setSize(r.width, r.height);
  });
});

/* ==================================================
   CUSTOM CURSOR
================================================== */
const cursorDot = document.getElementById('cursorDot');
const cursorRing = document.getElementById('cursorRing');
let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursorDot.style.left = mouseX - 4 + 'px';
  cursorDot.style.top = mouseY - 4 + 'px';
});

function animateCursor() {
  ringX += (mouseX - ringX) * 0.15;
  ringY += (mouseY - ringY) * 0.15;
  cursorRing.style.left = ringX - 20 + 'px';
  cursorRing.style.top = ringY - 20 + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.querySelectorAll('a, button, .hero-frame, .info-card').forEach(el => {
  el.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
  el.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
});

/* ==================================================
   SCROLL & REVEAL
================================================== */
const heroes = document.querySelectorAll('.hero');
const sideCounter = document.getElementById('sideCounter');
const progressV = document.getElementById('progressV');
const nav = document.querySelector('.corner-nav');

let currentIdx = 0;
let ticking = false;

function update() {
  const st = window.scrollY;
  const dh = document.documentElement.scrollHeight - window.innerHeight;
  const p = (st / dh) * 100;
  progressV.style.height = p + '%';

  const mid = st + window.innerHeight / 2;
  heroes.forEach((h, i) => {
    const inView = mid >= h.offsetTop && mid < h.offsetTop + h.offsetHeight;
    if (inView && i !== currentIdx) {
      currentIdx = i;
      sideCounter.textContent = String(i + 1).padStart(2, '0');
    }
  });

  // Parallax tilt
  heroes.forEach(h => {
    const rect = h.getBoundingClientRect();
    const prog = (rect.top + rect.height / 2 - window.innerHeight / 2) / window.innerHeight;
    const panel = h.querySelector('.hero-panel');
    const visual = h.querySelector('.hero-visual');
    const num = h.querySelector('.hero-number');

    if (panel) panel.style.transform = `translateY(${prog * 40}px)`;
    if (visual) visual.style.transform = `translateY(${-prog * 30}px)`;
    if (num) num.style.transform = `translateY(${prog * 80}px)`;
  });
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      update();
      ticking = false;
    });
    ticking = true;
  }
});

/* ==================================================
   INTERSECTION REVEAL
================================================== */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('animated');
    }
  });
}, { threshold: 0.15 });

heroes.forEach(h => revealObserver.observe(h));

/* ==================================================
   MOUSE 3D ON FRAME
================================================== */
heroes.forEach(hero => {
  hero.addEventListener('mousemove', (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    const frame = hero.querySelector('.hero-frame');
    if (frame) {
      frame.style.transform = `perspective(1400px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg)`;
    }
  });
  hero.addEventListener('mouseleave', () => {
    const frame = hero.querySelector('.hero-frame');
    if (frame) frame.style.transform = '';
  });
});

/* ==================================================
   SPLASH OUT
================================================== */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('gone');
    update();
  }, 3200);
});

/* ==================================================
   KEYBOARD NAV
================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    const next = Math.min(100, currentIdx + 1);
    document.getElementById(`h${next + 1}`)?.scrollIntoView({ behavior: 'smooth' });
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    const prev = Math.max(0, currentIdx - 1);
    document.getElementById(`h${prev + 1}`)?.scrollIntoView({ behavior: 'smooth' });
  }
});
