<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۱۰۰ هیرو سکشن متفاوت | Volume 2 - Neon Dreams</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@300;400;600;700&family=Cinzel:wght@400;700;900&family=Audiowide&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ==========================================
   BASE RESET
========================================== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #02020a;
  --text: #ffffff;
  --muted: #8b8ba7;
}

html { scroll-behavior: smooth; overflow-x: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #050510; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff00ff, #00ffff, #ffd700, #ff00ff);
  border-radius: 10px;
}

/* ==========================================
   LOADER
========================================== */
.loader {
  position: fixed;
  inset: 0;
  background: #02020a;
  z-index: 100000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.loader.hidden { opacity: 0; visibility: hidden; }

.loader-logo {
  font-family: 'Audiowide', cursive;
  font-size: 64px;
  font-weight: 400;
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ffd700, #ff00ff);
  background-size: 400% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 2.5s linear infinite;
  margin-bottom: 50px;
  letter-spacing: 8px;
  filter: drop-shadow(0 0 30px rgba(255,0,255,0.5));
}

@keyframes shine {
  to { background-position: 400% center; }
}

.loader-grid {
  display: grid;
  grid-template-columns: repeat(3, 20px);
  gap: 12px;
  margin-bottom: 30px;
}

.loader-cell {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  background: #ff00ff;
  animation: cellPulse 1.5s ease-in-out infinite;
}

.loader-cell:nth-child(1) { animation-delay: 0s; background: #ff00ff; }
.loader-cell:nth-child(2) { animation-delay: 0.1s; background: #d500f9; }
.loader-cell:nth-child(3) { animation-delay: 0.2s; background: #aa00ff; }
.loader-cell:nth-child(4) { animation-delay: 0.3s; background: #7c4dff; }
.loader-cell:nth-child(5) { animation-delay: 0.4s; background: #536dfe; }
.loader-cell:nth-child(6) { animation-delay: 0.5s; background: #00e5ff; }
.loader-cell:nth-child(7) { animation-delay: 0.6s; background: #18ffff; }
.loader-cell:nth-child(8) { animation-delay: 0.7s; background: #84ffff; }
.loader-cell:nth-child(9) { animation-delay: 0.8s; background: #b2ff59; }

@keyframes cellPulse {
  0%, 100% { transform: scale(0.6); opacity: 0.4; }
  50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 25px currentColor; }
}

.loader-bar {
  width: 320px;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff00ff, #00ffff);
  box-shadow: 0 0 20px #ff00ff;
  transition: width 0.3s ease;
}
.loader-percent {
  margin-top: 20px;
  font-family: 'JetBrains Mono', monospace;
  color: #ff00ff;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ==========================================
   PROGRESS BAR
========================================== */
.progress-bar {
  position: fixed;
  top: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ffd700, #ff00ff);
  background-size: 300% auto;
  z-index: 9999;
  width: 0%;
  animation: shine 3s linear infinite;
  box-shadow: 0 0 20px rgba(255,0,255,0.9);
}

/* ==========================================
   TOP HUD
========================================== */
.top-hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 14px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 9998;
  transition: all 0.4s ease;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.top-hud.scrolled {
  background: rgba(2,2,10,0.85);
  backdrop-filter: blur(25px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.hud-left, .hud-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.hud-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
}
.hud-item .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00ff41;
  box-shadow: 0 0 8px #00ff41;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}
.hud-brand {
  font-family: 'Audiowide', cursive;
  font-size: 16px;
  background: linear-gradient(90deg, #ff00ff, #00ffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}

/* ==========================================
   BOTTOM HUD
========================================== */
.bottom-hud {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(2,2,10,0.85);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,0,255,0.25);
  padding: 10px 24px;
  border-radius: 50px;
  z-index: 9997;
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #ff00ff;
  box-shadow: 0 10px 40px rgba(255,0,255,0.2);
}
.hud-num {
  color: #fff;
  font-weight: 700;
  font-size: 15px;
}
.hud-sep {
  opacity: 0.4;
}
.hud-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}

/* ==========================================
   SIDE TIME PANEL
========================================== */
.time-panel {
  position: fixed;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
  z-index: 9997;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: rgba(2,2,10,0.6);
  backdrop-filter: blur(20px);
  padding: 20px 12px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.06);
}
.time-label {
  writing-mode: vertical-rl;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.time-value {
  writing-mode: vertical-rl;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  color: #00ffff;
  font-weight: 700;
  letter-spacing: 2px;
}

/* ==========================================
   HERO BASE
========================================== */
.hero {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 90px 60px 90px;
  perspective: 2500px;
  transform-style: preserve-3d;
  isolation: isolate;
}

.hero-canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.hero-content {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 70px;
  max-width: 1500px;
  width: 100%;
  align-items: center;
  transform-style: preserve-3d;
  position: relative;
  z-index: 10;
}
.hero-content.reverse { direction: ltr; }
.hero-content.reverse > * { direction: rtl; }

.hero-text { transform-style: preserve-3d; will-change: transform; }

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 30px;
  backdrop-filter: blur(10px);
  text-transform: uppercase;
  font-family: 'Orbitron', sans-serif;
  position: relative;
  overflow: hidden;
}
.hero-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transform: translateX(-100%);
  animation: badgeShine 3s infinite;
}
@keyframes badgeShine { to { transform: translateX(100%); } }
.hero-badge .badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 10px currentColor;
  animation: pulse 1.5s infinite;
}

.hero-title {
  font-family: 'Vazirmatn', sans-serif;
  font-size: clamp(42px, 5.5vw, 82px);
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 28px;
  letter-spacing: -2px;
}

.hero-desc {
  font-size: 17px;
  line-height: 2;
  opacity: 0.85;
  margin-bottom: 40px;
  max-width: 580px;
  color: var(--muted);
}

.hero-buttons { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }

.btn {
  padding: 18px 40px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  font-family: 'Vazirmatn', sans-serif;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}
.btn:hover::before { transform: translateX(100%); }
.btn-primary { color: #000; box-shadow: 0 15px 45px rgba(255,0,255,0.4); }
.btn-primary:hover { transform: translateY(-5px) scale(1.05); }
.btn-outline {
  background: transparent;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
}
.btn-outline:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.7);
  transform: translateY(-5px);
}

/* ==========================================
   HERO MEDIA
========================================== */
.hero-image-wrap {
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 550px;
}

.hero-media-frame {
  position: relative;
  width: 100%;
  max-width: 620px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 60px 120px rgba(0,0,0,0.7), 0 0 60px rgba(255,0,255,0.15);
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
  z-index: 2;
}

.hero-media {
  width: 100%;
  height: 500px;
  object-fit: cover;
  display: block;
  transition: transform 0.7s ease;
}
.hero-media-frame:hover .hero-media { transform: scale(1.08); }

.hero-video {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 2;
}
.hero-media-frame:hover .hero-video { opacity: 1; }

.frame-corner {
  position: absolute;
  width: 30px;
  height: 30px;
  border: 2px solid #ff00ff;
  z-index: 5;
  pointer-events: none;
}
.frame-corner.tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
.frame-corner.tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
.frame-corner.bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
.frame-corner.br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

/* ==========================================
   FLOAT CARDS
========================================== */
.float-card {
  position: absolute;
  background: rgba(10,10,25,0.92);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 16px 22px;
  border-radius: 16px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  z-index: 15;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  white-space: nowrap;
  pointer-events: none;
  transform-style: preserve-3d;
}
.float-card::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff5f56;
  box-shadow: 14px 0 0 #ffbd2e, 28px 0 0 #27c93f;
}
.float-card .code-line {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.code-key { color: #ff79c6; }
.code-val { color: #50fa7b; }
.code-comment { color: #6272a4; }

.float-card-1 { top: 30px; right: -30px; animation: floatCard 5s ease-in-out infinite; }
.float-card-2 { bottom: 60px; left: -40px; animation: floatCard 5s ease-in-out infinite 1.5s; }
.float-card-3 { top: 55%; right: -50px; animation: floatCard 5s ease-in-out infinite 0.8s; }
.float-card-4 { bottom: 20px; right: 20px; animation: floatCard 5s ease-in-out infinite 2.2s; }

@keyframes floatCard {
  0%, 100% { transform: translateY(0) translateZ(60px) rotateY(-5deg); }
  50% { transform: translateY(-18px) translateZ(80px) rotateY(5deg); }
}

/* ==========================================
   GLOW ORBS
========================================== */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 1;
  pointer-events: none;
  will-change: transform;
}
.orb-1 { width: 600px; height: 600px; top: -150px; right: -150px; }
.orb-2 { width: 500px; height: 500px; bottom: -150px; left: -150px; }

/* ==========================================
   THEME 1: NEON DREAMS
========================================== */
.n1 { background: radial-gradient(ellipse at top right, #1a0033 0%, #02020a 60%); }
.n1 .orb-1 { background: #ff00ff; opacity: 0.35; }
.n1 .orb-2 { background: #00ffff; opacity: 0.3; }
.n1 .hero-badge { background: rgba(255,0,255,0.12); color: #ff00ff; border: 1px solid rgba(255,0,255,0.4); }
.n1 .hero-title {
  background: linear-gradient(120deg, #ff00ff, #00ffff, #ff00ff);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.n1 .btn-primary { background: linear-gradient(135deg, #ff00ff, #00bfff); }

/* ==========================================
   THEME 2: HOLOGRAM
========================================== */
.n2 { background: #050520; }
.n2 .orb-1 { background: #00e5ff; opacity: 0.4; }
.n2 .orb-2 { background: #ff00ff; opacity: 0.35; }
.n2 .hero-badge { background: rgba(0,229,255,0.15); color: #00e5ff; border: 1px solid rgba(0,229,255,0.4); }
.n2 .hero-title {
  background: linear-gradient(90deg, #00e5ff, #ff00ff, #00ff41, #00e5ff);
  background-size: 400% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
}
.n2 .btn-primary { background: linear-gradient(135deg, #00e5ff, #ff00ff); color: #fff; }

/* ==========================================
   THEME 3: SYNTHWAVE
========================================== */
.n3 { background: linear-gradient(180deg, #2d1b4e 0%, #0f0524 100%); }
.n3 .orb-1 { background: #ff006e; opacity: 0.4; }
.n3 .orb-2 { background: #fb5607; opacity: 0.4; }
.n3 .hero-badge { background: rgba(255,0,110,0.15); color: #ff006e; border: 1px solid rgba(255,0,110,0.4); }
.n3 .hero-title {
  background: linear-gradient(90deg, #ff006e, #fb5607, #ffbe0b, #ff006e);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
}
.n3 .btn-primary { background: linear-gradient(135deg, #ff006e, #fb5607); color: #fff; }

/* ==========================================
   THEME 4: AURORA
========================================== */
.n4 { background: radial-gradient(ellipse at bottom, #001a1a 0%, #02020a 70%); }
.n4 .orb-1 { background: #00ffa3; opacity: 0.4; }
.n4 .orb-2 { background: #a855f7; opacity: 0.35; }
.n4 .hero-badge { background: rgba(0,255,163,0.15); color: #00ffa3; border: 1px solid rgba(0,255,163,0.4); }
.n4 .hero-title {
  background: linear-gradient(90deg, #00ffa3, #a855f7, #00ffa3);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.n4 .btn-primary { background: linear-gradient(135deg, #00ffa3, #a855f7); color: #000; }

/* ==========================================
   THEME 5: VAPORWAVE
========================================== */
.n5 { background: linear-gradient(180deg, #ff6ec7 0%, #7873f5 100%); }
.n5 .orb-1 { background: #ffe74c; opacity: 0.5; }
.n5 .orb-2 { background: #ff6ec7; opacity: 0.4; }
.n5 .hero-badge { background: rgba(255,255,255,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
.n5 .hero-title { color: #fff; text-shadow: 0 4px 40px rgba(0,0,0,0.4); }
.n5 .hero-desc { color: rgba(255,255,255,0.95); }
.n5 .btn-primary { background: #fff; color: #7873f5; }

/* ==========================================
   THEME 6: GLITCH
========================================== */
.n6 { background: #000; }
.n6 .orb-1 { background: #00ffff; opacity: 0.2; }
.n6 .orb-2 { background: #ff0000; opacity: 0.2; }
.n6 .hero-badge { background: rgba(0,255,255,0.1); color: #00ffff; border: 1px solid rgba(0,255,255,0.3); }
.n6 .hero-title {
  color: #fff;
  text-shadow: 3px 0 #ff0000, -3px 0 #00ffff;
  animation: glitch 3s infinite;
}
@keyframes glitch {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(-3px, 1px); }
  94% { transform: translate(3px, -1px); }
  96% { transform: translate(-2px, -1px); }
  98% { transform: translate(2px, 1px); }
}
.n6 .btn-primary { background: linear-gradient(135deg, #00ffff, #ff0000); color: #000; }

/* ==========================================
   THEME 7: SUNSET BEACH
========================================== */
.n7 { background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 100%); }
.n7 .orb-1 { background: #ffd700; opacity: 0.5; }
.n7 .orb-2 { background: #ff7e5f; opacity: 0.4; }
.n7 .hero-badge { background: rgba(255,255,255,0.3); color: #7d2a00; border: 1px solid rgba(125,42,0,0.3); }
.n7 .hero-title { color: #7d2a00; text-shadow: 0 4px 30px rgba(255,255,255,0.5); }
.n7 .hero-desc { color: #7d2a00; opacity: 0.85; }
.n7 .btn-primary { background: #7d2a00; color: #fff; }

/* ==========================================
   THEME 8: MINT FRESH
========================================== */
.n8 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
.n8 .orb-1 { background: #a8edea; opacity: 0.6; }
.n8 .orb-2 { background: #fed6e3; opacity: 0.5; }
.n8 .hero-badge { background: rgba(255,255,255,0.5); color: #2c5364; border: 1px solid rgba(44,83,100,0.3); }
.n8 .hero-title { color: #2c5364; }
.n8 .hero-desc { color: #2c5364; opacity: 0.8; }
.n8 .btn-primary { background: #2c5364; color: #fff; }

/* ==========================================
   THEME 9: CYBER LIME
========================================== */
.n9 { background: #0a0a0a; }
.n9 .orb-1 { background: #39ff14; opacity: 0.4; }
.n9 .orb-2 { background: #00ff88; opacity: 0.3; }
.n9 .hero-badge { background: rgba(57,255,20,0.15); color: #39ff14; border: 1px solid rgba(57,255,20,0.4); }
.n9 .hero-title { color: #39ff14; text-shadow: 0 0 40px rgba(57,255,20,0.6); }
.n9 .btn-primary { background: linear-gradient(135deg, #39ff14, #00ff88); color: #000; }

/* ==========================================
   THEME 10: DEEP BLUE
========================================== */
.n10 { background: linear-gradient(180deg, #0a192f 0%, #000000 100%); }
.n10 .orb-1 { background: #64ffda; opacity: 0.4; }
.n10 .orb-2 { background: #4a90e2; opacity: 0.35; }
.n10 .hero-badge { background: rgba(100,255,218,0.15); color: #64ffda; border: 1px solid rgba(100,255,218,0.4); }
.n10 .hero-title {
  background: linear-gradient(90deg, #64ffda, #4a90e2, #64ffda);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.n10 .btn-primary { background: linear-gradient(135deg, #64ffda, #4a90e2); color: #000; }

/* ==========================================
   THEME 11: NEON NIGHTCLUB
========================================== */
.n11 { background: radial-gradient(ellipse at center, #2a0a4a 0%, #000 70%); }

.marquee-wrap {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.6);

  padding: 12px 0;

.deco-hex {

/* ==========================================
   THREE.JS CANVAS
========================================== */
document.querySelectorAll('.hero-canvas').forEach((canvas, idx) => {
  const hero = canvas.closest('.hero');
  const rect = hero.getBoundingClientRect();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, rect.width / rect.height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  const particleCount = 90;
  const particlesGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 22;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 22;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 12;
    velocities.push({
      x: (Math.random() - 0.5) * 0.012,
      y: (Math.random() - 0.5) * 0.012,
      z: (Math.random() - 0.5) * 0.012
    });
  }

  particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const colors = [0xff00ff, 0x00ffff, 0x00ff88, 0xffd700, 0xa855f7, 0xff006e, 0x00e5ff, 0xff3d00];
  const color = colors[idx % colors.length];

  const particlesMat = new THREE.PointsMaterial({
    color,
    size: 0.07,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(particlesGeo, particlesMat);
  scene.add(particles);

  // Icosahedron
  const geometry = new THREE.IcosahedronGeometry(1.5, 1);
  const material = new THREE.MeshBasicMaterial({
    color,
    wireframe: true,
    transparent: true,
    opacity: 0.13
  });
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // Rings
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(2.3, 0.02, 8, 60),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28 })
  );
  scene.add(ring);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(2.9, 0.015, 8, 60),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16 })
  );
  scene.add(ring2);

  let mouseX = 0, mouseY = 0;
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width - 0.5) * 2;
    mouseY = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });

  let visible = false;
  new IntersectionObserver((entries) => {
    visible = entries[0].isIntersecting;
  }, { threshold: 0.05 }).observe(hero);

  function animate() {
    requestAnimationFrame(animate);
    if (!visible) return;

    mesh.rotation.x += 0.003;
    mesh.rotation.y += 0.005;
    ring.rotation.x += 0.002;
    ring.rotation.y -= 0.003;
    ring2.rotation.z += 0.004;

    const pos = particlesGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i * 3] += velocities[i].x;
      pos[i * 3 + 1] += velocities[i].y;
      pos[i * 3 + 2] += velocities[i].z;

      if (Math.abs(pos[i * 3]) > 11) velocities[i].x *= -1;
      if (Math.abs(pos[i * 3 + 1]) > 11) velocities[i].y *= -1;
      if (Math.abs(pos[i * 3 + 2]) > 6) velocities[i].z *= -1;
    }
    particlesGeo.attributes.position.needsUpdate = true;

    camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.05;
    camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const r = hero.getBoundingClientRect();
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    renderer.setSize(r.width, r.height);
  });
});

/* ==========================================
   SCROLL / COUNTER
========================================== */
const progressBar = document.getElementById('progressBar');
const currentHeroEl = document.getElementById('currentHero');
const currentSectionEl = document.getElementById('currentSection');
const topHud = document.getElementById('topHud');
const allHeroes = document.querySelectorAll('.hero');
let ticking = false;

function updateScroll() {
  const st = window.scrollY;
  const dh = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (st / dh) * 100 + '%';

  if (st > 100) topHud.classList.add('scrolled');
  else topHud.classList.remove('scrolled');

  const mid = st + window.innerHeight / 2;
  let currentIdx = 0;
  allHeroes.forEach((h, i) => {
    if (mid >= h.offsetTop && mid < h.offsetTop + h.offsetHeight) {
      currentIdx = i;
      h.dataset.section && (currentSectionEl.textContent = h.dataset.section);
    }
  });

  currentHeroEl.textContent = String(currentIdx + 1).padStart(3, '0');
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      updateScroll();
      handleParallax();
      ticking = false;
    });
    ticking = true;
  }
});

function handleParallax() {
  const vh = window.innerHeight;
  allHeroes.forEach(hero => {
    const rect = hero.getBoundingClientRect();
    const progress = (rect.top + rect.height / 2 - vh / 2) / vh;

    const textEl = hero.querySelector('.hero-text');
    const imgEl = hero.querySelector('.hero-image-wrap');
    const orbs = hero.querySelectorAll('.glow-orb');

    if (textEl) {
      textEl.style.transform = `perspective(2000px) rotateY(${progress * 12}deg) translateZ(${-Math.abs(progress) * 80}px)`;
    }
    if (imgEl) {
      imgEl.style.transform = `perspective(2000px) rotateY(${-progress * 12}deg) translateZ(${-Math.abs(progress) * 120}px)`;
    }
    orbs.forEach((orb, i) => {
      orb.style.transform = `translateY(${progress * (30 + i * 20)}px)`;
    });

    const content = hero.querySelector('.hero-content');
    if (content) content.style.opacity = Math.max(0, 1 - Math.abs(progress) * 0.7);
  });
}

/* ==========================================
   MOUSE 3D
========================================== */
allHeroes.forEach(hero => {
  hero.addEventListener('mousemove', (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    const frame = hero.querySelector('.hero-media-frame');
    if (frame) {
      frame.style.transform = `perspective(1200px) rotateY(${x * 25}deg) rotateX(${-y * 25}deg) scale(1.02)`;
    }

    hero.querySelectorAll('.float-card').forEach((card, i) => {
      const d = 20 + i * 15;
      card.style.transform = `translate3d(${x * d}px, ${y * d}px, ${60 + i * 20}px) rotateY(${x * 15}deg)`;
    });
  });

  hero.addEventListener('mouseleave', () => {
    const f = hero.querySelector('.hero-media-frame');
    if (f) f.style.transform = '';
    hero.querySelectorAll('.float-card').forEach(c => c.style.transform = '');
  });
});

   LOADER
========================================== */
let lp = 0;
const lf = document.getElementById('loaderFill');
const lpct = document.getElementById('loaderPercent');
const loader = document.getElementById('loader');

const li = setInterval(() => {
  lp += Math.random() * 14;
  if (lp >= 100) {
    lp = 100;
    clearInterval(li);
    setTimeout(() => {
      loader.classList.add('hidden');
      setTimeout(() => loader.style.display = 'none', 800);
      updateScroll();
      handleParallax();
    }, 300);
  }
  lf.style.width = lp + '%';
  lpct.textContent = Math.floor(lp);
}, 100);

/* ==========================================
   CLOCK + SESSION TIMER
========================================== */
const clockEl = document.getElementById('clock');
const sessionEl = document.getElementById('sessionTime');
const startTime = Date.now();

setInterval(() => {
  const now = new Date();
  clockEl.textContent = now.toTimeString().slice(0, 8);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');
  sessionEl.textContent = `${mm}:${ss}`;
}, 1000);

/* ==========================================
   KEYBOARD
========================================== */
document.addEventListener('keydown', (e) => {
  const cur = parseInt(currentHeroEl.textContent);
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    const nxt = Math.min(100, cur + 1);
    document.getElementById(`n${nxt}`)?.scrollIntoView({ behavior: 'smooth' });
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    const prv = Math.max(1, cur - 1);
    document.getElementById(`n${prv}`)?.scrollIntoView({ behavior: 'smooth' });
  }
});

    handleParallax();
