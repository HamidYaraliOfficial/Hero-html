<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINETIC | ۱۰۰ تجربه بصری سیال</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Archivo+Black&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@300;400;600&family=Unbounded:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ================================================
   KINETIC — FLUID DESIGN SYSTEM
================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --void: #000000;
  --mist: #e8e6e3;
  --wire: #2a2a2a;
  --kinetic-a: #ff2d55;
  --kinetic-b: #5e5ce6;
  --kinetic-c: #30d158;
  --kinetic-d: #ff9f0a;
  --kinetic-e: #64d2ff;
  --ghost: rgba(255,255,255,0.08);
}

html { overflow-x: hidden; }

body {
  background: var(--void);
  color: var(--mist);
  font-family: 'Vazirmatn', sans-serif;
  overflow-x: hidden;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff2d55, #5e5ce6, #30d158, #ff9f0a);
  border-radius: 3px;
}

/* ================================================
   PRELOADER
================================================ */
.preloader {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 100000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1.2s cubic-bezier(0.83, 0, 0.17, 1);
}
.preloader.out {
  opacity: 0;
  pointer-events: none;
}

.preloader-visual {
  position: relative;
  width: 240px;
  height: 240px;
}

.preloader-blob {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, #ff2d55 0%, transparent 70%);
  filter: blur(30px);
  animation: blobMorph 3s ease-in-out infinite;
}
.preloader-blob:nth-child(2) {
  background: radial-gradient(circle, #5e5ce6 0%, transparent 70%);
  animation-delay: 0.7s;
  transform: scale(0.8);
}
.preloader-blob:nth-child(3) {
  background: radial-gradient(circle, #30d158 0%, transparent 70%);
  animation-delay: 1.4s;
  transform: scale(0.6);
}
@keyframes blobMorph {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

.preloader-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 8px;
  color: #fff;
  white-space: nowrap;
  animation: textPulse 1.5s ease-in-out infinite;
}
@keyframes textPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ================================================
   FLOATING MENU (DOCK)
================================================ */
.dock {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,25,0.75);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 8px 8px;
  z-index: 9990;
  display: flex;
  align-items: center;
  gap: 2px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transition: all 0.5s cubic-bezier(0.83, 0, 0.17, 1);
}
.dock.hidden {
  transform: translateX(-50%) translateY(-120px);
}
.dock-brand {
  font-family: 'Archivo Black', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 10px 20px;
  color: #fff;
  border-radius: 100px;
  background: linear-gradient(135deg, #ff2d55, #5e5ce6);
  margin-left: 4px;
}
.dock-link {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 100px;
  transition: all 0.3s ease;
  text-transform: uppercase;
}
.dock-link:hover {
  color: #fff;
  background: rgba(255,255,255,0.06);
}

/* ================================================
   SIDE RAIL — Chapters
================================================ */
.chapter-rail {
  position: fixed;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 9980;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 8px;
  background: rgba(20,20,25,0.5);
  backdrop-filter: blur(20px);
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.05);
  max-height: 70vh;
  overflow-y: auto;
  scrollbar-width: none;
}
.chapter-rail::-webkit-scrollbar { display: none; }

.chapter-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}
.chapter-dot:hover {
  background: #fff;
  transform: scale(1.6);
}
.chapter-dot.active {
  background: linear-gradient(135deg, #ff2d55, #5e5ce6);
  box-shadow: 0 0 12px rgba(255,45,85,0.8);
  height: 20px;
  border-radius: 100px;
}

/* ================================================
   BOTTOM BAR
================================================ */
.bottom-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,25,0.7);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 8px 20px;
  z-index: 9980;
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  white-space: nowrap;
}
.bottom-bar .bb-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 16px;
  color: #fff;
  letter-spacing: 0;
}
.bottom-bar .bb-divider {
  width: 1px;
  height: 16px;
  background: rgba(255,255,255,0.1);
}
.bottom-bar .bb-status {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #30d158;
  box-shadow: 0 0 10px #30d158;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ================================================
   HERO BASE
================================================ */
.hero {
  min-height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 60px;
  isolation: isolate;
}

.hero-canvas {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
}

/* Radial gradient background */
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ================================================
   CONTENT LAYOUT
================================================ */
.hero-shell {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 1600px;
  display: grid;
  grid-template-columns: 380px 1fr 400px;
  gap: 40px;
  align-items: center;
}

/* LEFT — Metadata column */
.hero-left {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-left: 40px;
  border-left: 1px solid rgba(255,255,255,0.1);
}

.hero-id {
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.3);
  margin-bottom: 8px;
}
.hero-id .accent {
  color: #ff2d55;
}

.hero-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: currentColor;
}

.hero-stats {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 20px;
}
.stat-block {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 14px;
}
.stat-block-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 6px;
}
.stat-block-value {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: #fff;
  letter-spacing: -0.5px;
}

/* CENTER — Main title + media */
.hero-center {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  align-self: flex-start;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
}
.hero-tag .tag-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #30d158;
  box-shadow: 0 0 8px #30d158;
  animation: pulse 1.5s infinite;
}

.hero-headline {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: clamp(48px, 6.5vw, 108px);
  line-height: 0.92;
  letter-spacing: -3px;
  color: #fff;
  margin: 0;
}
.hero-headline .line {
  display: block;
  overflow: hidden;
}
.hero-headline .line span {
  display: inline-block;
  transform: translateY(100%);
  transition: transform 1.2s cubic-bezier(0.83, 0, 0.17, 1);
}
.hero.visible .hero-headline .line span {
  transform: translateY(0);
}
.hero-headline .line:nth-child(1) span { transition-delay: 0.15s; }
.hero-headline .line:nth-child(2) span { transition-delay: 0.3s; }
.hero-headline .line:nth-child(3) span { transition-delay: 0.45s; }

.hero-headline .gradient-word {
  background: linear-gradient(90deg, #ff2d55, #5e5ce6, #30d158, #ff9f0a);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 6s linear infinite;
}
@keyframes gradientShift {
  to { background-position: 300% center; }
}

.hero-description {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 20px;
  line-height: 1.6;
  color: rgba(255,255,255,0.6);
  max-width: 640px;
  letter-spacing: -0.2px;
}

/* MEDIA STRIP */
.hero-media-strip {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 16px;
  height: 320px;
}

.media-cell {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: #111;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.83, 0, 0.17, 1);
}
.media-cell img,
.media-cell video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.9s cubic-bezier(0.83, 0, 0.17, 1);
}
.media-cell video {
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.83, 0, 0.17, 1);
}
.media-cell:hover video { opacity: 1; }
.media-cell:hover img,
.media-cell:hover video {
  transform: scale(1.1);
}

.media-cell::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7));
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.media-cell:hover::after { opacity: 0.4; }

.media-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  padding: 6px 12px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 100px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: #fff;
  z-index: 3;
}
.media-caption {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: #fff;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.media-caption::after {
  content: '↗';
  font-size: 14px;
}

/* Small stacked media */
.media-stack {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
}

/* RIGHT — Actions column */
.hero-right {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-right: 40px;
  border-right: 1px solid rgba(255,255,255,0.1);
  align-items: flex-end;
  text-align: right;
}

.action-primary {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 20px 32px;
  background: #fff;
  color: #000;
  text-decoration: none;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1px;
  border-radius: 100px;
  transition: all 0.5s cubic-bezier(0.83, 0, 0.17, 1);
  position: relative;
  overflow: hidden;
  width: fit-content;
}
.action-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #ff2d55, #5e5ce6, #30d158, #ff9f0a);
  background-size: 300% auto;
  opacity: 0;
  transition: opacity 0.4s ease;
  animation: gradientShift 3s linear infinite;
}
.action-primary:hover {
  color: #fff;
  transform: translateX(-6px);
}
.action-primary:hover::before {
  opacity: 1;
}
.action-primary span {
  position: relative;
  z-index: 1;
}
.action-primary .arrow {
  font-size: 18px;
  position: relative;
  z-index: 1;
  transition: transform 0.4s ease;
}
.action-primary:hover .arrow {
  transform: translateX(-6px);
}

.action-secondary {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  padding: 12px 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: color 0.3s ease;
  position: relative;
}
.action-secondary::before {
  content: '';
  position: absolute;
  bottom: 8px;
  right: 0;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.4s cubic-bezier(0.83, 0, 0.17, 1);
}
.action-secondary:hover {
  color: #fff;
}
.action-secondary:hover::before {
  transform: scaleX(1);
}

/* Info pills */
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 12px;
}
.pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.5);
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}
.pill:hover {
  color: #fff;
  border-color: rgba(255,255,255,0.3);
  transform: translateY(-2px);
}

/* ================================================
   COLOR THEMES — 20 palettes
================================================ */

/* 1 */ .k-1 { background: radial-gradient(ellipse at top right, #1a0005 0%, #000 60%); }
.k-1 .hero-bg { background: radial-gradient(circle at 30% 20%, rgba(255,45,85,0.15), transparent 50%); }
.k-1 .hero-headline .gradient-word { background: linear-gradient(90deg, #ff2d55, #ff9f0a, #ff2d55); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 5s linear infinite; }

/* ============================================
   THREE.JS PARTICLES
============================================ */
document.querySelectorAll('.hero-canvas').forEach((canvas, idx) => {
  const hero = canvas.closest('.hero');
  const rect = hero.getBoundingClientRect();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, rect.width / rect.height, 0.1, 1000);
  camera.position.z = 6;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  // Points field
  const count = 100;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 26;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 26;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 14;
    velocities.push({
      x: (Math.random() - 0.5) * 0.006,
      y: (Math.random() - 0.5) * 0.006,
      z: (Math.random() - 0.5) * 0.006
    });
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const palettes = [0xff2d55, 0x5e5ce6, 0x30d158, 0xff9f0a, 0x64d2ff, 0xbf5af2, 0xff375f, 0x00ffa3];
  const color = palettes[idx % palettes.length];

  const mat = new THREE.PointsMaterial({
    color,
    size: 0.045,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Fluid wave mesh (grid deformed)
  const gridSize = 30;
  const spacing = 0.7;
  const gridGeo = new THREE.BufferGeometry();
  const gridVerts = [];
  const gridIndices = [];
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      gridVerts.push((x - gridSize / 2) * spacing, (y - gridSize / 2) * spacing, 0);
    }
  }
  for (let y = 0; y < gridSize - 1; y++) {
    for (let x = 0; x < gridSize - 1; x++) {
      const a = y * gridSize + x;
      const b = a + 1;
      const c = a + gridSize;
      const d = c + 1;
      gridIndices.push(a, b, d, a, d, c);
    }
  }
  gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridVerts, 3));
  gridGeo.setIndex(gridIndices);

  const gridMat = new THREE.MeshBasicMaterial({
    color,
    wireframe: true,
    transparent: true,
    opacity: 0.04
  });

  const gridMesh = new THREE.Mesh(gridGeo, gridMat);
  scene.add(gridMesh);

  let mx = 0, my = 0;
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    my = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });

  let visible = false;
  new IntersectionObserver((entries) => {
    visible = entries[0].isIntersecting;
  }, { threshold: 0.05 }).observe(hero);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    if (!visible) return;
    t += 0.01;

    // Update points positions
    const pos = geo.attributes.position.array;
    for (let i = 0; i < count; i++) {
      pos[i * 3] += velocities[i].x;
      pos[i * 3 + 1] += velocities[i].y;
      pos[i * 3 + 2] += velocities[i].z;
      if (Math.abs(pos[i * 3]) > 13) velocities[i].x *= -1;
      if (Math.abs(pos[i * 3 + 1]) > 13) velocities[i].y *= -1;
      if (Math.abs(pos[i * 3 + 2]) > 7) velocities[i].z *= -1;
    }
    geo.attributes.position.needsUpdate = true;

    // Deform grid with wave
    const gpos = gridGeo.attributes.position.array;
    for (let i = 0; i < gpos.length; i += 3) {
      const x = gpos[i];
      const y = gpos[i + 1];
      gpos[i + 2] = Math.sin(x * 0.4 + t) * 0.5 + Math.cos(y * 0.4 + t * 0.7) * 0.5;
    }
    gridGeo.attributes.position.needsUpdate = true;

    gridMesh.rotation.x = -0.6 + my * 0.1;
    gridMesh.rotation.z = mx * 0.05;

    points.rotation.y += 0.0006;

    camera.position.x += (mx * 1 - camera.position.x) * 0.04;
    camera.position.y += (-my * 1 - camera.position.y) * 0.04;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const r = hero.getBoundingClientRect();
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    renderer.setSize(r.width, r.height);
  });
});

/* ============================================
   REVEAL + SCROLL STATE
============================================ */
const heroes = document.querySelectorAll('.hero');
const dots = document.querySelectorAll('.chapter-dot');
const bottomNum = document.getElementById('bottomNum');
const bottomLabel = document.getElementById('bottomLabel');
const bottomClock = document.getElementById('bottomClock');
const dock = document.getElementById('dock');
const startTime = Date.now();

const revealObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
    }
  });
}, { threshold: 0.15 });

heroes.forEach(h => revealObs.observe(h));

let currentIdx = 0;
let ticking = false;

function update() {
  const st = window.scrollY;
  const mid = st + window.innerHeight / 2;

  heroes.forEach((h, i) => {
    if (mid >= h.offsetTop && mid < h.offsetTop + h.offsetHeight) {
      if (currentIdx !== i) {
        currentIdx = i;
        bottomNum.textContent = String(i + 1).padStart(2, '0');
        bottomLabel.textContent = h.dataset.label || 'CHAPTER';
        dots.forEach((dd, di) => dd.classList.toggle('active', di === i));
      }
    }
  });

  // Parallax tilt
  heroes.forEach(h => {
    const rect = h.getBoundingClientRect();
    const prog = (rect.top + rect.height / 2 - window.innerHeight / 2) / window.innerHeight;
    const headline = h.querySelector('.hero-headline');
    const media = h.querySelector('.hero-media-strip');
    const left = h.querySelector('.hero-left');
    const right = h.querySelector('.hero-right');

    if (headline) headline.style.transform = `translateY(${prog * 20}px)`;
    if (media) media.style.transform = `translateY(${-prog * 25}px)`;
    if (left) left.style.transform = `translateY(${prog * 15}px)`;
    if (right) right.style.transform = `translateY(${-prog * 15}px)`;
  });

  // Hide dock when scrolling fast? toggle
  if (st > 100) dock.classList.add('hidden');
  else dock.classList.remove('hidden');
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      update();
      ticking = false;
    });
    ticking = true;
  }
});

/* ============================================
   CLOCK
============================================ */
setInterval(() => {
  const now = new Date();
  bottomClock.textContent = now.toTimeString().slice(0, 8);
}, 1000);

/* ============================================
   3D TILT ON MEDIA CELLS
============================================ */
document.querySelectorAll('.media-cell').forEach(cell => {
  cell.addEventListener('mousemove', (e) => {
    const r = cell.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    cell.style.transform = `perspective(900px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
  });
  cell.addEventListener('mouseleave', () => {
    cell.style.transform = '';
  });
});

/* ============================================
   PRELOADER OUT
============================================ */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('preloader').classList.add('out');
    update();
  }, 2600);
});

/* ============================================
   KEYBOARD
============================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    const next = Math.min(100, currentIdx + 2);
    document.getElementById(`h${next}`)?.scrollIntoView({ behavior: 'smooth' });
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    const prev = Math.max(1, currentIdx);
    document.getElementById(`h${prev}`)?.scrollIntoView({ behavior: 'smooth' });
  }
});
