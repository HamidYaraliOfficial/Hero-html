<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۱۰۰ هیرو سکشن سه بعدی حرفه‌ای | Pro Dev Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
/* ============================================
   RESET & BASE
============================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --neon-cyan: #00ffff;
  --neon-pink: #ff00ff;
  --neon-green: #00ff41;
  --neon-purple: #a855f7;
  --neon-orange: #ff6b00;
  --deep-dark: #03030f;
  --dark-1: #0a0a1a;
  --dark-2: #12122a;
  --dark-3: #1a1a3a;
  --text-primary: #ffffff;
  --text-secondary: #a0a0c0;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  background: var(--deep-dark);
  color: var(--text-primary);
  font-family: 'Vazirmatn', sans-serif;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   CUSTOM SCROLLBAR
============================================ */
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #050510;
}
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #00ffff, #ff00ff, #00ff41);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #ff00ff, #00ffff, #ff00ff);
}

/* ============================================
   LOADING SCREEN
============================================ */
.loader {
  position: fixed;
  inset: 0;
  background: #03030f;
  z-index: 100000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

.loader.hidden {
  opacity: 0;
  visibility: hidden;
}

.loader-logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 60px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ffff, #ff00ff, #00ff41, #00ffff);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 2s linear infinite;
  margin-bottom: 40px;
  letter-spacing: 5px;
}

.loader-bar {
  width: 300px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}

.loader-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ffff, #ff00ff);
  transition: width 0.3s ease;
  box-shadow: 0 0 20px #00ffff;
}

.loader-percent {
  margin-top: 20px;
  font-family: 'JetBrains Mono', monospace;
  color: #00ffff;
  font-size: 14px;
}

@keyframes shine {
  to { background-position: 300% center; }
}

/* ============================================
   PROGRESS BAR
============================================ */
.progress-bar {
  position: fixed;
  top: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #00ffff, #ff00ff, #00ff41, #f7df1e, #00ffff);
  background-size: 300% auto;
  z-index: 9999;
  width: 0%;
  animation: shine 3s linear infinite;
  box-shadow: 0 0 20px rgba(0,255,255,0.8);
}

/* ============================================
   NAVIGATION
============================================ */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 9998;
  transition: all 0.4s ease;
  backdrop-filter: blur(0px);
}

.nav.scrolled {
  background: rgba(10,10,26,0.85);
  backdrop-filter: blur(20px);
  padding: 12px 60px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.nav-logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ffff, #ff00ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}

.nav-links {
  display: flex;
  gap: 35px;
  list-style: none;
}

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s ease;
  position: relative;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -5px;
  right: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, #00ffff, #ff00ff);
  transition: width 0.3s ease;
}

.nav-links a:hover {
  color: #fff;
}

.nav-links a:hover::after {
  width: 100%;
}

/* ============================================
   HERO COUNTER
============================================ */
.hero-counter {
  position: fixed;
  bottom: 30px;
  left: 30px;
  background: rgba(10,10,26,0.7);
  backdrop-filter: blur(20px);
  padding: 14px 28px;
  border-radius: 50px;
  border: 1px solid rgba(0,255,255,0.3);
  z-index: 9997;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #00ffff;
  box-shadow: 0 10px 40px rgba(0,255,255,0.2);
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-counter .dot {
  width: 8px;
  height: 8px;
  background: #00ff41;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 10px #00ff41;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.hero-counter span.num {
  color: #fff;
  font-weight: 700;
}

/* ============================================
   SIDE NAVIGATION DOTS
============================================ */
.side-nav {
  position: fixed;
  right: 30px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 9997;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 10px;
  scrollbar-width: none;
}

.side-nav::-webkit-scrollbar { display: none; }

.side-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.side-dot:hover {
  background: #00ffff;
  transform: scale(1.5);
  box-shadow: 0 0 15px #00ffff;
}

.side-dot.active {
  background: linear-gradient(135deg, #00ffff, #ff00ff);
  box-shadow: 0 0 20px #00ffff;
  transform: scale(1.3);
}

/* ============================================
   HERO SECTION BASE
============================================ */
.hero {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 100px 60px 60px;
  perspective: 2500px;
  transform-style: preserve-3d;
  isolation: isolate;
}

.hero-canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.hero-content {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 70px;
  max-width: 1500px;
  width: 100%;
  align-items: center;
  transform-style: preserve-3d;
  position: relative;
  z-index: 10;
}

.hero-content.reverse {
  direction: ltr;
}

.hero-content.reverse > * {
  direction: rtl;
}

.hero-text {
  transform-style: preserve-3d;
  will-change: transform;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 30px;
  backdrop-filter: blur(10px);
  text-transform: uppercase;
  font-family: 'Orbitron', sans-serif;
  position: relative;
  overflow: hidden;
}

.hero-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: translateX(-100%);
  animation: badgeShine 3s infinite;
}

@keyframes badgeShine {
  to { transform: translateX(100%); }
}

.hero-badge .badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 10px currentColor;
  animation: pulse 1.5s infinite;
}

.hero-title {
  font-family: 'Vazirmatn', sans-serif;
  font-size: clamp(42px, 5.5vw, 84px);
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 28px;
  letter-spacing: -2px;
}

.hero-desc {
  font-size: 17px;
  line-height: 2;
  opacity: 0.85;
  margin-bottom: 40px;
  max-width: 580px;
  color: var(--text-secondary);
}

.hero-buttons {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  padding: 18px 40px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  font-family: 'Vazirmatn', sans-serif;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}

.btn:hover::before {
  transform: translateX(100%);
}

.btn-primary {
  background: linear-gradient(135deg, #00ffff, #00bfff);
  color: #000;
  box-shadow: 0 15px 45px rgba(0,255,255,0.4);
}

.btn-primary:hover {
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 25px 60px rgba(0,255,255,0.7);
}

.btn-outline {
  background: transparent;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
}

.btn-outline:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.7);
  transform: translateY(-5px);
}

.btn svg {
  transition: transform 0.3s ease;
}

.btn:hover svg {
  transform: translateX(-6px);
}

/* ============================================
   HERO MEDIA (IMAGE + VIDEO)
============================================ */
.hero-image-wrap {
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 550px;
}

.hero-media-frame {
  position: relative;
  width: 100%;
  max-width: 620px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 60px 120px rgba(0,0,0,0.7),
    0 0 60px rgba(0,255,255,0.15),
    inset 0 0 0 1px rgba(255,255,255,0.1);
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
  z-index: 2;
}

.hero-media-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(0,255,255,0.1) 50%, transparent 100%);
  z-index: 3;
  pointer-events: none;
}

.hero-media {
  width: 100%;
  height: 500px;
  object-fit: cover;
  display: block;
  transition: transform 0.7s ease;
}

.hero-media-frame:hover .hero-media {
  transform: scale(1.08);
}

.hero-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 2;
}

.hero-media-frame:hover .hero-video {
  opacity: 1;
}

/* Frame corner decorations */
.frame-corner {
  position: absolute;
  width: 30px;
  height: 30px;
  border: 2px solid #00ffff;
  z-index: 5;
  pointer-events: none;
}

.frame-corner.tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
.frame-corner.tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
.frame-corner.bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
.frame-corner.br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

/* ============================================
   FLOATING CODE CARDS
============================================ */
.float-card {
  position: absolute;
  background: rgba(15,15,35,0.92);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 16px 22px;
  border-radius: 16px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  z-index: 15;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  white-space: nowrap;
  pointer-events: none;
  transform-style: preserve-3d;
}

.float-card::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff5f56;
  box-shadow: 14px 0 0 #ffbd2e, 28px 0 0 #27c93f;
}

.float-card .code-line {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.float-card .code-key {
  color: #ff79c6;
}

.float-card .code-val {
  color: #50fa7b;
}

.float-card .code-comment {
  color: #6272a4;
}

.float-card-1 { top: 30px; right: -30px; animation: floatCard 5s ease-in-out infinite; }
.float-card-2 { bottom: 60px; left: -40px; animation: floatCard 5s ease-in-out infinite 1.5s; }
.float-card-3 { top: 55%; right: -50px; animation: floatCard 5s ease-in-out infinite 0.8s; }
.float-card-4 { bottom: 20px; right: 20px; animation: floatCard 5s ease-in-out infinite 2.2s; }
.float-card-5 { top: 15px; left: -40px; animation: floatCard 5s ease-in-out infinite 1.1s; }

@keyframes floatCard {
  0%, 100% { transform: translateY(0) translateZ(60px) rotateY(-5deg); }
  50% { transform: translateY(-18px) translateZ(80px) rotateY(5deg); }
}

/* ============================================
   GLOW ORBS
============================================ */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 1;
  pointer-events: none;
  will-change: transform;
}

.orb-1 { width: 600px; height: 600px; top: -150px; right: -150px; }
.orb-2 { width: 500px; height: 500px; bottom: -150px; left: -150px; }
.orb-3 { width: 400px; height: 400px; top: 50%; left: 50%; transform: translate(-50%,-50%); }

/* ============================================
   GRID PATTERN BACKGROUND
============================================ */
.grid-pattern {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: 1;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}

/* ============================================
   SCROLL INDICATOR
============================================ */
.scroll-indicator {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0.6;
  animation: bounceDown 2s infinite;
}

.scroll-indicator span {
  font-size: 10px;
  letter-spacing: 3px;
  font-family: 'Orbitron', sans-serif;
  text-transform: uppercase;
}

.scroll-mouse {
  width: 24px;
  height: 40px;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 12px;
  position: relative;
}

.scroll-mouse::after {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 8px;
  background: #00ffff;
  border-radius: 3px;
  animation: scrollWheel 1.5s infinite;
}

@keyframes scrollWheel {
  0% { opacity: 0; transform: translate(-50%, 0); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, 15px); }
}

@keyframes bounceDown {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ============================================
   PARTICLES
============================================ */
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 2;
}

/* ============================================
   THEME: CYBERPUNK (H1)
============================================ */
.h1 {
  background: radial-gradient(ellipse at top right, #1a0033 0%, #03030f 60%);
}
.h1 .orb-1 { background: #ff00ff; opacity: 0.35; }
.h1 .orb-2 { background: #00ffff; opacity: 0.3; }
.h1 .hero-badge { background: rgba(255,0,255,0.12); color: #ff00ff; border: 1px solid rgba(255,0,255,0.4); }
.h1 .hero-title {
  background: linear-gradient(120deg, #ff00ff, #00ffff, #ff00ff);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.h1 .btn-primary { background: linear-gradient(135deg, #ff00ff, #00bfff); box-shadow: 0 15px 45px rgba(255,0,255,0.4); }
.h1 .frame-corner { border-color: #ff00ff; }

/* ============================================
   THEME: MATRIX (H2)
============================================ */
.h2 { background: #000; }
.h2 .orb-1 { background: #00ff41; opacity: 0.15; top: 50%; right: 50%; }
.h2 .hero-badge { background: rgba(0,255,65,0.1); color: #00ff41; border: 1px solid rgba(0,255,65,0.3); }
.h2 .hero-title { color: #00ff41; text-shadow: 0 0 40px rgba(0,255,65,0.7); font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
.h2 .hero-desc { color: #00ff41; opacity: 0.7; font-family: 'JetBrains Mono', monospace; }
.h2 .btn-primary { background: #00ff41; color: #000; box-shadow: 0 15px 45px rgba(0,255,65,0.5); }
.h2 .frame-corner { border-color: #00ff41; }

/* ============================================
   THEME: OCEAN (H3)
============================================ */
.h3 { background: linear-gradient(180deg, #001f3f 0%, #003366 50%, #00509e 100%); }
.h3 .orb-1 { background: #00bfff; opacity: 0.5; }
.h3 .orb-2 { background: #7ec8e3; opacity: 0.4; }
.h3 .hero-badge { background: rgba(0,191,255,0.15); color: #7ec8e3; border: 1px solid rgba(0,191,255,0.4); }
.h3 .hero-title {
  background: linear-gradient(90deg, #7ec8e3, #ffffff, #00bfff, #7ec8e3);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.h3 .btn-primary { background: linear-gradient(135deg, #00bfff, #7ec8e3); color: #000; }
.h3 .frame-corner { border-color: #7ec8e3; }

/* ============================================
   THEME: FIRE (H4)
============================================ */
.h4 { background: radial-gradient(ellipse at bottom, #2a0800 0%, #03030f 65%); }
.h4 .orb-1 { background: #ff4500; opacity: 0.5; }
.h4 .orb-2 { background: #ffd700; opacity: 0.35; }
.h4 .hero-badge { background: rgba(255,69,0,0.15); color: #ff6b00; border: 1px solid rgba(255,69,0,0.4); }
.h4 .hero-title {
  background: linear-gradient(120deg, #f12711, #f5af19, #f12711);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.h4 .btn-primary { background: linear-gradient(135deg, #f12711, #f5af19); box-shadow: 0 15px 45px rgba(255,69,0,0.5); }
.h4 .frame-corner { border-color: #ff6b00; }

/* ============================================
   THEME: ICE (H5)
============================================ */
.h5 { background: linear-gradient(180deg, #0a1628, #1a3a5c, #2d5f8a); }
.h5 .orb-1 { background: #6dd5ed; opacity: 0.4; }
.h5 .orb-2 { background: #ffffff; opacity: 0.2; }
.h5 .hero-badge { background: rgba(109,213,237,0.15); color: #6dd5ed; border: 1px solid rgba(109,213,237,0.4); }
.h5 .hero-title {
  background: linear-gradient(90deg, #ffffff, #6dd5ed, #ffffff);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}
.h5 .btn-primary { background: linear-gradient(135deg, #6dd5ed, #2193b0); color: #000; }
.h5 .frame-corner { border-color: #6dd5ed; }

/* ============================================
   THEME: GOLD (H6)
============================================ */
.h6 { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); }
.h6 .orb-1 { background: #d4af37; opacity: 0.35; }
.h6 .hero-badge { background: rgba(212,175,55,0.15); color: #d4af37; border: 1px solid rgba(212,175,55,0.4); }
.h6 .hero-title {
  background: linear-gradient(120deg, #d4af37, #ffd700, #d4af37);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;

/* ============================================
   MARQUEE / TICKER
============================================ */
.marquee-wrap {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(20px);
  padding: 12px 0;
  overflow: hidden;
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 15;
}

.marquee {
  display: flex;
  gap: 50px;
  animation: marquee 30s linear infinite;
  white-space: nowrap;
}

.marquee span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.marquee span::after {
  content: '◆';
  color: #00ffff;
  font-size: 8px;
}

@keyframes marquee {
  to { transform: translateX(50%); }
}

/* ============================================

============================================ */
.tech-stack {
  position: absolute;
  top: 100px;
  left: 60px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  z-index: 15;
  opacity: 0.6;
}

.tech-icon {
  width: 40px;
  height: 40px;
  background: rgba(0,0,0,0.5);

  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  transition: all 0.3s ease;
  cursor: pointer;
}

.tech-icon:hover {
  transform: scale(1.15) translateX(5px);

  opacity: 1;
}

          <div class="tech-icon">⬢</div>
          <div class="tech-icon">◈</div>

        <div class="stats-display">
          <div class="stat-item">

            <span class="stat-value">99.9%</span>

            <span class="stat-value">${index + 1}ms</span>
            <span class="stat-label">Response</span>

            <span class="kw">const</span> <span class="fn">hero</span> = {<br>

/* ============================================
   THREE.JS CANVAS PER HERO
============================================ */
document.querySelectorAll('.hero-canvas').forEach((canvas, idx) => {
  const hero = canvas.closest('.hero');
  const rect = hero.getBoundingClientRect();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, rect.width / rect.height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  // ذرات نقطه‌ای
  const particlesGeo = new THREE.BufferGeometry();
  const particleCount = 80;
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
    velocities.push({
      x: (Math.random() - 0.5) * 0.01,
      y: (Math.random() - 0.5) * 0.01,
      z: (Math.random() - 0.5) * 0.01
    });
  }

  particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const getColor = () => {
    const colors = [0x00ffff, 0xff00ff, 0x00ff41, 0xff6b00, 0xa855f7, 0xffd700];
    return colors[idx % colors.length];
  };

  const particlesMat = new THREE.PointsMaterial({
    color: getColor(),
    size: 0.06,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(particlesGeo, particlesMat);
  scene.add(particles);

  // Wireframe Object
  const geometry = new THREE.IcosahedronGeometry(1.4, 1);
  const material = new THREE.MeshBasicMaterial({
    color: getColor(),
    wireframe: true,
    transparent: true,
    opacity: 0.12
  });
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // حلقه‌ها
  const ringGeo = new THREE.TorusGeometry(2.2, 0.02, 8, 60);
  const ringMat = new THREE.MeshBasicMaterial({
    color: getColor(),
    transparent: true,
    opacity: 0.25
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  scene.add(ring);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(2.8, 0.015, 8, 60),
    new THREE.MeshBasicMaterial({ color: getColor(), transparent: true, opacity: 0.15 })
  );
  scene.add(ring2);

  let mouseX = 0, mouseY = 0;
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width - 0.5) * 2;
    mouseY = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });

  let visible = false;
  const observer = new IntersectionObserver((entries) => {
    visible = entries[0].isIntersecting;
  }, { threshold: 0.05 });
  observer.observe(hero);

  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    if (!visible) return;
    time += 0.005;

    mesh.rotation.x += 0.003;
    mesh.rotation.y += 0.005;
    ring.rotation.x += 0.002;
    ring.rotation.y -= 0.003;
    ring2.rotation.z += 0.004;

    // به‌روزرسانی ذرات
    const pos = particlesGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i * 3] += velocities[i].x;
      pos[i * 3 + 1] += velocities[i].y;
      pos[i * 3 + 2] += velocities[i].z;

      if (Math.abs(pos[i * 3]) > 10) velocities[i].x *= -1;
      if (Math.abs(pos[i * 3 + 1]) > 10) velocities[i].y *= -1;
      if (Math.abs(pos[i * 3 + 2]) > 5) velocities[i].z *= -1;
    }
    particlesGeo.attributes.position.needsUpdate = true;

    camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.05;
    camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const r = hero.getBoundingClientRect();
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    renderer.setSize(r.width, r.height);
  });
});

/* ============================================
   SCROLL PROGRESS + COUNTER + SIDE NAV
============================================ */
const progressBar = document.getElementById('progressBar');
const currentHeroEl = document.getElementById('currentHero');
const currentSectionEl = document.getElementById('currentSection');
const nav = document.getElementById('nav');
const sideDots = document.querySelectorAll('.side-dot');
const allHeroes = document.querySelectorAll('.hero');

let ticking = false;

function updateScroll() {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / docHeight) * 100;
  progressBar.style.width = progress + '%';

  // Navbar
  if (scrollTop > 100) nav.classList.add('scrolled');
  else nav.classList.remove('scrolled');

  // Current hero index
  const viewportMid = scrollTop + window.innerHeight / 2;
  let currentIdx = 0;
  allHeroes.forEach((hero, i) => {
    const top = hero.offsetTop;
    const bottom = top + hero.offsetHeight;
    if (viewportMid >= top && viewportMid < bottom) {
      currentIdx = i;
      hero.dataset.section && (currentSectionEl.textContent = hero.dataset.section);
    }
  });

  const heroNum = String(currentIdx + 1).padStart(2, '0');
  currentHeroEl.textContent = heroNum;

  // Side nav active
  sideDots.forEach((dot, i) => {
    dot.classList.toggle('active', i === currentIdx);
  });
}

window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      updateScroll();
      handleParallax();
      ticking = false;
    });
    ticking = true;
  }
});

/* ============================================
   PARALLAX 3D
============================================ */
function handleParallax() {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;

  allHeroes.forEach(hero => {
    const rect = hero.getBoundingClientRect();
    const center = rect.top + rect.height / 2;
    const dist = center - vh / 2;
    const progress = dist / vh;

    const textEl = hero.querySelector('.hero-text');
    const imgEl = hero.querySelector('.hero-image-wrap');
    const orbs = hero.querySelectorAll('.glow-orb');

    if (textEl) {
      const rotY = progress * 12;
      const tz = -Math.abs(progress) * 80;
      textEl.style.transform = `perspective(2000px) rotateY(${rotY}deg) translateZ(${tz}px)`;
    }
    if (imgEl) {
      const rotY = -progress * 12;
      const tz = -Math.abs(progress) * 120;
      imgEl.style.transform = `perspective(2000px) rotateY(${rotY}deg) translateZ(${tz}px)`;
    }
    orbs.forEach((orb, i) => {
      orb.style.transform = `translateY(${progress * (30 + i * 20)}px)`;
    });

    const content = hero.querySelector('.hero-content');
    if (content) {
      content.style.opacity = Math.max(0, 1 - Math.abs(progress) * 0.7);
    }
  });
}

/* ============================================
   MOUSE 3D EFFECT
============================================ */
allHeroes.forEach(hero => {
  hero.addEventListener('mousemove', (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    const frame = hero.querySelector('.hero-media-frame');
    if (frame) {
      frame.style.transform = `perspective(1200px) rotateY(${x * 25}deg) rotateX(${-y * 25}deg) scale(1.02)`;
    }

    const cards = hero.querySelectorAll('.float-card');
    cards.forEach((card, i) => {
      const depth = 20 + i * 15;
      card.style.transform = `translate3d(${x * depth}px, ${y * depth}px, ${60 + i * 20}px) rotateY(${x * 15}deg)`;
    });
  });

  hero.addEventListener('mouseleave', () => {
    const frame = hero.querySelector('.hero-media-frame');
    if (frame) frame.style.transform = '';
    hero.querySelectorAll('.float-card').forEach(c => c.style.transform = '');
  });
});

/* ============================================
   LOADER
============================================ */
let loadProgress = 0;
const loaderFill = document.getElementById('loaderFill');
const loaderPercent = document.getElementById('loaderPercent');
const loader = document.getElementById('loader');

const loadInterval = setInterval(() => {
  loadProgress += Math.random() * 12;
  if (loadProgress >= 100) {
    loadProgress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      loader.classList.add('hidden');
      setTimeout(() => { loader.style.display = 'none'; }, 800);
      updateScroll();
      handleParallax();
    }, 300);
  }
  loaderFill.style.width = loadProgress + '%';
  loaderPercent.textContent = Math.floor(loadProgress);
}, 100);

/* ============================================
   INITIAL
============================================ */
window.addEventListener('load', () => {
  setTimeout(() => {
    updateScroll();
    handleParallax();
  }, 1200);
});

/* ============================================
   KEYBOARD NAVIGATION
============================================ */
document.addEventListener('keydown', (e) => {
  const current = parseInt(currentHeroEl.textContent);
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    const next = Math.min(100, current + 1);
    document.getElementById(`h${next}`).scrollIntoView({ behavior: 'smooth' });
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    const prev = Math.max(1, current - 1);
    document.getElementById(`h${prev}`).scrollIntoView({ behavior: 'smooth' });
  }
});
